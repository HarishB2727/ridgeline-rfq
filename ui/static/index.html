<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ridgeline RFQ Pipeline</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="veil"><div class="veil-inner"><span>drop <b>.eml</b> files</span></div></div>

<header>
  <span class="logo"></span>
  <div class="title">
    <strong>Ridgeline RFQ Pipeline</strong>
    <span class="muted small">every email, every stage, every model call</span>
  </div>
  <div class="spacer"></div>
  <div id="meter" class="meter"></div>
  <label class="btn ghost">add .eml<input type="file" id="picker" multiple accept=".eml,message/rfc822" hidden></label>
  <button class="btn primary" id="process" disabled>Process</button>
  <button class="btn ghost" id="reset" hidden>Clear</button>
</header>

<!-- the pipeline, as the column headers of everything below -->
<div id="pipebar" class="pipebar"></div>

<div id="grid" class="grid"></div>

<div id="dropzone" class="dropzone">
  <div class="dz-icon"></div>
  <h1>Drop an inbox here</h1>
  <p class="lede">All at once, or a few at a time. Dropping only reads the headers —
  nothing is sent anywhere until you press <b>Process</b>.</p>
  <p class="muted small">try <code>data/dev/emails/</code></p>
</div>

<script src="/static/app.js"></script>
</body>
</html>
